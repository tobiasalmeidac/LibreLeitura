# Sobe um PostgreSQL local para desenvolvimento:  docker compose up -d
services:
  banco:
    image: postgres:16
    environment:
      POSTGRES_USER: libreleitura
      POSTGRES_PASSWORD: libreleitura
      POSTGRES_DB: libreleitura
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data

volumes:
  dados_postgres:
